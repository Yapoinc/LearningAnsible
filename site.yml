---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (CentoS)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when : ansible_distribution | lower in ["centos", "redhat", "fedora"]

  - name: install updates (Ubuntu/Debian)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when : ansible_distribution | lower in ["ubuntu", "debian"]

- hosts: workstations
  become: true
  tasks:

  - name: install unzip package    
    package:
      name: 
        - unzip
      state: latest
  
  # - name: install terraform package    
  #   unarchive:
