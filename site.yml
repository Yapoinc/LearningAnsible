---

- hosts: all
  become: true
  pre_tasks:

  - name: update repo cache (CentoS)
    tags: always
    dnf:
      update_cache: yes
    changed_when: false
    when : ansible_distribution | lower in ["centos", "redhat", "fedora"]

  - name: update repo cache (Ubuntu/Debian)
    tags: always
    apt:
      update_cache: yes
    changed_when: false
    when : ansible_distribution | lower in ["ubuntu", "debian"]

#this is a play
- hosts: all
  become: true
  roles:
    - base

- hosts: workstations
  become: true
  roles:
    - workstations

- hosts: web_servers
  become: true
  roles:
    - web_servers
    
- hosts: db_servers
  become: true
  roles:
    - db_servers

- hosts: file_servers
  tags: samba
  become: true
  roles:
    - file_servers
