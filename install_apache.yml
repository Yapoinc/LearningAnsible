---

- hosts: all
  become: true
  tasks:

  - name: Install Apache2 and php packages
    apt:
      name: 
        - apache2
        - libapache2-mod-php
      state: latest
      update_cache: yes
    when : ansible_distribution in ["Ubuntu", "Debian"]


# CentOS Support
  - name: Install Apache2 and php packages in centos
    dnf:
      name: 
        - httpd
        - php
      state: latest
      update_cache: yes
    when : ansible_distribution in ["CentOS"]


