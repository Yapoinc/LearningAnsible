---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (CentoS)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution | lower in ["centos", "redhat", "fedora"]

  - name: install updates (Ubuntu/Debian)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution | lower in ["ubuntu", "debian"]

- hosts: all
  become: true
  tasks:

  - name: create simone user
    tags: always
    user:
      name: simone
      group: root

  - name: add ssh key for simone user
    tags: always
    authorized_key:
      user: simone
      # state: present
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPwAda4uXN4/o9VksxtKCZxWoCcaAzFWKPGKR65JSrUj Ansible checvron"

  - name: add sudoers file for simone user
    tags: always
    copy:
      src: files/sudoer_simone
      dest: /etc/sudoers.d/simone
      owner: root
      group: root
      mode: 440
